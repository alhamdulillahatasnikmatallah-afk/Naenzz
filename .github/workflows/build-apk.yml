name: Build NanzMusify APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          test -f NanzMusify_GitHubUpload.zip
          echo "ZIP ditemukan."

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q NanzMusify_GitHubUpload.zip -d project

      - name: Find Android project
        run: |
          ROOT=$(find project -name settings.gradle.kts -type f -print -quit | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project: $ROOT"

          test -d "$ROOT/app"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Detect Gradle version
        id: gradle
        run: |
          VERSION=$(grep -oP 'gradle-\K[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' \
            "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.properties" || true)

          if [ -z "$VERSION" ]; then
            VERSION="9.6.1"
          fi

          echo "Gradle version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Check APK files
        run: |
          echo "=== DEBUG ==="
          find "$PROJECT_ROOT/app/build/outputs/apk/debug" -type f -name "*.apk" -print

          echo "=== RELEASE ==="
          find "$PROJECT_ROOT/app/build/outputs/apk/release" -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NanzMusify-Debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NanzMusify-Release
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
