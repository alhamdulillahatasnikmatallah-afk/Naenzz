name: Build NanzMusify APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          test -f NanzMusify_GitHubUpload.zip
          echo "ZIP found."

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q NanzMusify_GitHubUpload.zip -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Detect Android project
        run: |
          if [ -f project/settings.gradle.kts ]; then
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"
          elif [ -f project/NanzMusify/settings.gradle.kts ]; then
            echo "PROJECT_ROOT=project/NanzMusify" >> "$GITHUB_ENV"
          else
            ROOT=$(find project -name settings.gradle.kts -type f -print -quit | xargs dirname)
            test -n "$ROOT"
            echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          fi

      - name: Show project root
        run: |
          echo "PROJECT_ROOT=$PROJECT_ROOT"
          test -d "$PROJECT_ROOT/app"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Read Gradle version
        id: gradle_version
        run: |
          VERSION=$(grep -oP 'gradle-\K[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' \
            "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.properties" || true)

          if [ -z "$VERSION" ]; then
            VERSION="9.6.1"
          fi

          echo "Gradle version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle :app:assembleRelease \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NanzMusify-Debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NanzMusify-Release
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
